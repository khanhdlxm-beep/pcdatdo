name: V1.8.6 Plan Chart Upgrade

on:
  push:
    branches:
      - v1.8.6-plan-chart

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[v186-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.8.6-plan-chart
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply data-safe chart upgrade
        run: python3 scripts/v186-plan-chart.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and production verification
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/AppShell.tsx app/globals.css scripts/verify-production.mjs package.json package-lock.json lib/app-version.ts
          git diff --cached --quiet && exit 0
          git commit -m "V1.8.6 show official plan references [v186-applied]"
          git push origin HEAD:v1.8.6-plan-chart
