name: AppShell optimize once

on:
  push:
    branches:
      - optimize-production-v1-8-3

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize-production-v1-8-3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove obsolete hard-coded dashboard data
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/AppShell.tsx')
          s=p.read_text()

          marker='const businessSupplementalKpis: KpiCard[] = ['
          if marker in s:
              start=s.index(marker)
              end=s.index('// Chỉ chuẩn hóa các ĐVT có căn cứ rõ trong PDF.', start)
              s=s[:start]+s[end:]

          s=s.replace("  const extras = supplementalKpisForDomain(domainId);\n  const sourceItems = [...field.items, ...extras.filter((extra) => !field.items.some((item) => item.id === extra.id))];", "  const sourceItems = field.items;")
          s=s.replace("const item = field?.items.find((x) => x.id === kpiId) ?? supplementalKpiForDomain(domainId, kpiId);", "const item = field?.items.find((x) => x.id === kpiId);")
          s=s.replace("const item = field?.items.find((x) => x.id === sheet.kpiId) ?? supplementalKpiForDomain(sheet.domainId, sheet.kpiId);", "const item = field?.items.find((x) => x.id === sheet.kpiId);")

          marker='const kpiPresentation: Record<string, KpiPresentation> = {'
          if marker in s:
              start=s.index(marker)
              end=s.find('\n};\n\nfunction ', start)
              if end < 0:
                  raise RuntimeError('Cannot locate kpiPresentation end')
              s=s[:start]+s[end+4:]

          s=s.replace("      advice: kpiPresentation[item.id]?.advice ?? ['Theo dõi chênh lệch TH/KH tháng và xu hướng các kỳ gần nhất.', 'Khi KPI lệch kế hoạch, ưu tiên xác định nguyên nhân theo lĩnh vực trước khi đưa vào kế hoạch hành động.'],", "      advice: ['Theo dõi chênh lệch TH/KH tháng và xu hướng các kỳ gần nhất.', 'Khi KPI lệch kế hoạch, ưu tiên xác định nguyên nhân theo lĩnh vực trước khi đưa vào kế hoạch hành động.'],")
          s=s.replace("  return kpiPresentation[item.id] ?? {\n    primaryValue: item.value,", "  return {\n    primaryValue: item.value,")

          for stale in ['businessSupplementalKpis','dvkhSupplementalKpis','supplementalKpisForDomain','supplementalKpiForDomain','kpiPresentation[item.id]']:
              if stale in s:
                  raise RuntimeError(f'Stale runtime hard-code remains: {stale}')
          p.write_text(s)
          PY
      - name: Commit optimized AppShell
        run: |
          if git diff --quiet; then
            echo 'No AppShell changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/AppShell.tsx
          git commit -m 'Remove hard-coded July dashboard fallbacks'
          git push origin HEAD:optimize-production-v1-8-3
