name: Chart polish once

on:
  push:
    branches:
      - ui-chart-polish-v1-8-4

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-chart-polish-v1-8-4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply chart polish
        run: python scripts/chart_polish_once.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/AppShell.tsx app/globals.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Polish chart visuals and y axis"
          git push origin HEAD:ui-chart-polish-v1-8-4
